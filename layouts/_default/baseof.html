<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {{ if .IsHome }}
      Encyclo Futé — Comprendre le quotidien simplement
    {{ else }}
      {{ .Title }} — Encyclo Futé
    {{ end }}
  </title>

  {{ if .Description }}
    <meta name="description" content="{{ .Description }}">
  {{ else }}
    <meta name="description" content="Encyclo Futé : des explications simples et fiables pour comprendre le quotidien.">
  {{ end }}

  <link rel="canonical" href="{{ .Permalink }}">

  {{ if .IsHome }}
    <meta property="og:type" content="website">
  {{ else }}
    <meta property="og:type" content="article">
  {{ end }}
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}Encyclo Futé : des explications simples et fiables pour comprendre le quotidien.{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">

  <link rel="stylesheet" href="/css/style.css">

  {{ if .IsHome }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Encyclo Futé",
    "url": "https://encyclo-fute.pages.dev/",
    "inLanguage": "fr",
    "isAccessibleForFree": true
  }
  </script>
  {{ end }}

  {{ if .IsPage }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "mainEntityOfPage": "{{ .Permalink }}",
    "headline": "{{ .Title }}",
    "description": "{{ with .Description }}{{ . }}{{ else }}Explication simple et fiable sur le sujet.{{ end }}",
    "datePublished": "{{ .Date.Format "2006-01-02T15:04:05" }}",
    "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05" }}",
    "inLanguage": "fr",
    "isAccessibleForFree": true,
    "copyrightYear": "{{ now.Year }}",
    "author": {
      "@type": "Person",
      "name": "Encyclo Futé"
    },
    "publisher": {
      "@type": "Organization",
      "name": "Encyclo Futé"
    }
    {{ with .Params.image }},
    "image": "{{ . }}"
    {{ end }}
  }
  </script>
  {{ end }}

</head>

<body>

  <header>
    <nav>
      <a href="/">Encyclo Futé</a>
      <a href="/encyclopedie/">Encyclopédie</a>
      <a href="/guides/">Guides pratiques</a>
      <a href="/articles/">Articles</a>
      <a href="/categories/">Catégories</a>
      <a href="/about/">À propos</a>
      <a href="/contact/">Contact</a>
    </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

</body>
</html>

<header class="site-header">
  <div class="header-inner">
    <a class="site-logo" href="{{ "/" | relURL }}" aria-label="Accueil — Les Petits Pourquoi">
      <img src="{{ "logo-lpp.png" | relURL }}" alt="Les Petits Pourquoi" width="160" height="40">
    </a>

    <nav class="main-nav" aria-label="Navigation principale">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}" {{ if $.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>
          {{ .Name }}
        </a>
      {{ end }}
    </nav>
  </div>
</header>

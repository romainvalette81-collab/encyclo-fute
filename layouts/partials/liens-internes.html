
{{ with .Params.curiosite }}
<section class="liens-internes">
  <h3>Et maintenant, pourquoi ?</h3>

  <ul>
    {{ range . }}
      <li>
        {{ if .url }}
          <a href="{{ .url }}">{{ .question }}</a>
        {{ else }}
          {{ .question }}
        {{ end }}
      </li>
    {{ end }}
  </ul>
</section>
{{ end }}
